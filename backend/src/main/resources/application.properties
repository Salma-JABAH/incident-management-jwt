server.port=8080
spring.application.name=incidents

# ---------- Base de donnees : H2 en memoire (par defaut) ----------
#spring.datasource.url=jdbc:h2:mem:incidentsdb;DB_CLOSE_DELAY=-1
spring.datasource.url=jdbc:h2:file:./data/incidentsdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Base de donnees : MySQL (decommenter pour l'utiliser) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/incidentsdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Secret >= 32 caracteres (HS256). A remplacer en production (variable d'environnement JWT_SECRET).
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-0123456789}
# Duree de vie de l'access token : 5 minutes (pratique pour tester l'expiration)
app.jwt.expiration-ms=300000
# Duree de vie du refresh token : 7 jours
app.jwt.refresh-expiration-ms=604800000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173
